<!doctype html>
<!-- Bant düzeni: tanitim. Palet indigo (AGENTS.md). İçerik data/*.json'dan js/site.js ile gelir; buraya içerik yazılmaz. -->
<html lang="tr" data-palet="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kemal Beydilli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="bant-tema.css">
<link rel="stylesheet" href="bant-temel.css">
<script src="bant-tema.js"></script>
<script src="js/site.js" defer></script>
<style>
/* Ortak: genişlik, tarih, teknoloji etiketi. Renk yalnızca var(--…) ile. */
.govde{max-width:1120px;margin:0 auto}
.tarih{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.teknoloji{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.teknoloji li{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--box);color:var(--ink-2)}
.bolum-baslik{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px}
.metin{margin:var(--space-2) 0 0;max-width:72ch}
.not{margin:0;font-size:13.5px;color:var(--ink-2)}
.kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-5)}
.proje-kart{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.proje-baslik{margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.25}
.proje-baslik a{color:var(--ink);text-decoration:none}
.proje-baslik a:hover{text-decoration:underline}
.proje-ozet{margin:0;color:var(--ink-2)}
.proje-alt{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap;padding-top:var(--space-3);border-top:1px solid var(--line-2)}
.proje-linkler{display:flex;gap:var(--space-4)}
.proje-linkler a{font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.giris{padding:var(--space-6) 0 var(--space-2);max-width:68ch}
.giris h1{margin:0 0 var(--space-3);font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.8px;text-wrap:balance}
.giris p{margin:0 0 var(--space-5);font-size:17px;color:var(--ink-2)}
.bolum{display:grid;gap:var(--space-4)}
.bolum-ust{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.bolum-ust a{font-weight:600}
.iki-sutun{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-5)}
.iki-sutun .kart{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.zaman{list-style:none;margin:0 0 var(--space-2);padding:0}
.zaman li{display:flex;justify-content:space-between;gap:var(--space-3);padding:6px 0;border-bottom:1px solid var(--line-2)}
.zaman li:last-child{border-bottom:0}
.iki-sutun .dugme{align-self:flex-start}
.iletisim{list-style:none;margin:0;padding:0}
.iletisim li{display:flex;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-bottom:1px solid var(--line-2);overflow-wrap:anywhere}
.iletisim li .etiket{flex:none;min-width:72px}
.iletisim li:last-child{border-bottom:0}
.iletisim .etiket{margin:0}
</style>
</head>
<body data-sayfa="ana">
<header class="band">
  <div><p class="band-ad"><span class="band-nokta"></span><span id="band-ad">Kemal Beydilli</span></p><p class="band-alt" id="band-alt"></p></div>
  <div class="bant-tema" data-bant-tema>
    <div class="bt-seg bt-gor" id="dil-secici" role="group" aria-label="Dil"><button type="button" data-dil="tr" aria-pressed="false">TR</button><button type="button" data-dil="en" aria-pressed="false">EN</button></div>
  </div>
</header>
<nav class="bar" aria-label="Bölümler"><a href="index.html" aria-current="page" data-i18n="nav_ana"></a><a href="projeler.html" data-i18n="nav_projeler"></a><a href="ozgecmis.html" data-i18n="nav_ozgecmis"></a></nav>
<main class="govde">
<noscript><div class="kart kart-bolum"><p>JavaScript is required to show this site. / Bu siteyi göstermek için JavaScript gerekir.</p></div></noscript>
<section class="giris">
  <h1 id="slogan"></h1>
  <p id="hakkimda"></p>
  <div class="eylem"><a class="dugme birincil" href="projeler.html" data-i18n="projeleri_gor"></a><a class="dugme" href="ozgecmis.html" data-i18n="ozgecmisi_gor"></a></div>
</section>
<section class="bolum" aria-labelledby="vitrin-baslik">
  <div class="bolum-ust"><h2 class="bolum-baslik" id="vitrin-baslik" data-i18n="one_cikan"></h2><a href="projeler.html" data-i18n="tum_projeler"></a></div>
  <div class="kartlar" id="vitrin"></div>
</section>
<div class="iki-sutun">
  <section class="kart" aria-labelledby="ko-baslik"><h2 class="panel-baslik" id="ko-baslik" data-i18n="kisa_ozgecmis"></h2><div id="kisa-ozgecmis"></div></section>
  <section class="kart" aria-labelledby="il-baslik"><h2 class="panel-baslik" id="il-baslik" data-i18n="iletisim"></h2><div id="iletisim"></div></section>
</div>
</main>
<footer class="alt-bant" id="alt-bant"></footer>
</body>
</html>
