<!doctype html>
<!-- Bant düzeni: tanitim. Palet indigo (AGENTS.md). İçerik data/*.json'dan js/site.js ile gelir; buraya içerik yazılmaz. -->
<html lang="tr" data-palet="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kemal Beydilli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="bant-tema.css">
<link rel="stylesheet" href="bant-temel.css">
<script src="bant-tema.js"></script>
<script>/* Varsayılan açık görünüm: kullanıcı Açık/Koyu seçmediyse sistemin koyu ayarı uygulanmaz (bant-tema.js değiştirilmeden). */
(function(){function acik(){try{if(localStorage.getItem("bant-gorunum"))return}catch(e){}if(window.Bant&&Bant.tema)Bant.tema.uygula(null,"acik")}acik();document.addEventListener("DOMContentLoaded",acik)})();</script>
<script src="js/site.js" defer></script>
<style>
/* Ortak: genişlik, tarih, teknoloji etiketi. Renk yalnızca var(--…) ile. */
.govde{max-width:1120px;margin:0 auto}
.tarih{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.teknoloji{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.teknoloji li{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--box);color:var(--ink-2)}
.bolum-baslik{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px}
.metin{margin:var(--space-2) 0 0;max-width:72ch}
.not{margin:0;font-size:13.5px;color:var(--ink-2)}
/* CV: site temasından bağımsız. <article class="cv" data-theme="acik"> her zaman açık tokenları kullanır;
   başlık bandı ve rakam şeridi bant tokenlarıyla (açık/koyuda aynı) dolgulu. Renk yalnızca var(--…). */
#ozgecmis{max-width:1040px;width:100%;margin:0 auto}
.cv{overflow:hidden;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-ust{display:grid;grid-template-columns:1fr auto;gap:var(--space-6);align-items:center;padding:24px var(--space-6) 22px;background:var(--band);color:var(--band-ink);border-bottom:4px solid var(--accent)}
.cv-kimlik{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.cv-kimlik h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.04;letter-spacing:-.8px;color:var(--band-ink)}
.cv-unvan{margin:0;font-size:17px;font-weight:600;color:var(--band-ink)}
.cv-slogan{margin:0;color:var(--band-ink-2);font-size:15px}
.cv-konum{margin:0;font-size:13.5px;color:var(--band-ink-2)}
.cv-arac{justify-content:flex-end;gap:var(--space-2);margin:0 0 var(--space-3)}
.cv-arac .dugme{min-height:38px;padding:0 14px;font-size:14px}
.cv-ust :focus-visible{outline-color:var(--band-ink)}
.cv-foto{width:144px;height:144px;object-fit:cover;border-radius:50%;border:4px solid var(--band-2);box-shadow:0 0 0 2px var(--accent);display:block}
.cv-iletisim .iletisim{list-style:none;margin:var(--space-2) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px var(--space-5)}
.cv-iletisim li{display:flex;gap:var(--space-2);align-items:baseline;overflow-wrap:anywhere;min-width:0;font-size:14px}
.cv-iletisim .etiket{margin:0;font-size:12px;color:var(--band-ink-2)}
.cv-iletisim a{color:var(--band-ink);text-decoration-color:var(--band-line);text-underline-offset:3px}
.cv-rakamlar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--band-2)}
.cv-rakam{padding:var(--space-4) var(--space-6);display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--band-line)}
.cv-rakam:first-child{border-left:0}
.cv-rakam b{font-family:var(--font-mono);font-weight:500;font-size:26px;color:var(--band-ink)}
.cv-rakam span{font-size:13px;color:var(--band-ink-2)}
.cv-govde{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);background:var(--card)}
.cv-ana{padding:var(--space-6);display:grid;gap:var(--space-6);align-content:start}
.cv-yan{padding:var(--space-6);display:grid;gap:var(--space-6);align-content:start;background:var(--tint)}
.cv-baslik{display:flex;align-items:center;gap:var(--space-3);margin:0 0 var(--space-4);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.2px}
.cv-baslik::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent);flex:none}
.cv-baslik::after{content:"";flex:1;height:1px;background:var(--line-3);opacity:.5}
.cv-ana .cv-baslik{font-size:18px}
.metin{margin:0}
.zaman-cizgisi{list-style:none;margin:0;padding:0}
.is{position:relative;padding:0 0 var(--space-5) 26px}
.is::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.is::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--fill)}
.is:first-child::after{background:var(--accent);border-color:var(--fill)}
.is:last-child{padding-bottom:0}
.is:last-child::before{display:none}
.is-bas{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap}
.is h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:17px}
.sirket{margin:2px 0 0;color:var(--code-ink);font-weight:600}
.is-bas .tarih{background:var(--tint);color:var(--code-ink);padding:2px 10px;border-radius:var(--radius-pill);font-size:12.5px}
.maddeler{margin:var(--space-2) 0 0;padding-left:18px}
.maddeler li{margin:3px 0}
.maddeler li::marker{color:var(--fill)}
.is-kisa h3{font-size:15px}
.is-kisa .maddeler{color:var(--ink-2)}
.cv-alt{padding:var(--space-6);background:var(--card);border-top:1px solid var(--line)}
.cv-projeler{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-3)}
.cv-projeler li{display:flex;flex-direction:column;gap:4px;padding:var(--space-3) var(--space-4);background:var(--box);border:1px solid var(--line);border-top:3px solid var(--fill);border-radius:var(--radius-sm)}
.cv-projeler a{font-weight:600;color:var(--ink)}
.cv-projeler span{color:var(--ink-2);font-size:13.5px}
.cv-tum{display:inline-flex;align-items:center;min-height:44px;margin-top:var(--space-2);font-weight:600}
.yetkinlik{margin-bottom:var(--space-4)}
.yetkinlik:last-child{margin-bottom:0}
.yetkinlik .etiket{color:var(--code-ink)}
.yetkinlik .teknoloji li{background:var(--card);border-color:var(--line);color:var(--ink)}
.yan-liste{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-4)}
.yan-liste li{display:flex;flex-direction:column;gap:1px}
.yan-liste li span{font-size:14px;color:var(--ink-2)}
.yan-liste li.satir{flex-direction:row;justify-content:space-between;gap:var(--space-3)}
.yan-liste .tarih{font-size:12.5px;color:var(--code-ink);white-space:normal}
.cv-menu{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-3);margin-top:var(--space-2)}
.cv-menu-dugme{min-width:44px;min-height:32px;padding:0 var(--space-2);background:transparent;border:0;border-radius:var(--radius-sm);color:var(--ink-2);font-size:20px;line-height:1;cursor:pointer;opacity:.6}
.cv-menu-dugme:hover,.cv-menu-dugme:focus-visible,.cv-menu-dugme[aria-expanded="true"]{opacity:1;background:var(--tint)}
.cv-menu-oge{font-size:13.5px;font-weight:600}
/* Düzenleme modu (?duzenle=1): düzenlenebilir alanlar kesik çizgiyle işaretli; araç çubuğu altta sabit. */
.duz{outline:1px dashed var(--line-3);outline-offset:2px;border-radius:2px;cursor:text}
.duz:hover{outline-color:var(--fill)}
.duz:focus{outline:2px solid var(--accent);background:var(--tint)}
.cv-ust .duz{outline-color:var(--band-line)}
.cv-ust .duz:focus{outline-color:var(--band-ink);background:var(--band-2)}
.duz:empty::before{content:"…";color:var(--ink-2)}
.duz-liste{font-size:14px}
body:has(.duzen-arac){padding-bottom:180px}
.duzen-arac{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-5);background:var(--card);border-top:3px solid var(--accent);box-shadow:var(--shadow-card)}
.duz-metin{flex:1 1 420px;min-width:0}
.duz-metin p{margin:0 0 2px}
.duz-metin .not{font-size:12.5px}
.duzen-arac .eylem{margin:0}
@media (max-width:640px){.duz-metin .not{display:none}.duzen-arac{padding:var(--space-3) var(--space-4)}}
@media (max-width:860px){
  .cv-govde{grid-template-columns:1fr}
  .cv-rakamlar{grid-template-columns:repeat(2,1fr)}
  .cv-rakam:nth-child(3){border-left:0}
  .cv-rakam:nth-child(n+3){border-top:1px solid var(--band-line)}
}
@media (max-width:640px){
  .cv-ust{grid-template-columns:1fr;padding:var(--space-5) var(--space-4);gap:var(--space-4)}
  .cv-foto{width:112px;height:112px;grid-row:1}
  .cv-iletisim .iletisim{flex-direction:column;gap:6px}
  .cv-iletisim .etiket{flex:none;min-width:64px}
  .cv-ana,.cv-yan,.cv-alt{padding:var(--space-5) var(--space-4)}
  .cv-rakam{padding:var(--space-3) var(--space-4)}
}
@media print{
  @page{size:A4;margin:8mm}
  /* Ortak: site çerçevesi gizli, renkler korunur, öğeler sayfa sonunda bölünmez. */
  .band,.bar,.alt-bant,.eylem,.pdf-not,.cv-tum,.duzen-arac,.cv-menu{display:none !important}
  body{background:var(--card)}
  .govde{padding:0;max-width:none}
  #ozgecmis{max-width:none}
  .kart{box-shadow:none;border:0;border-radius:0}
  .metin{max-width:none}
  a{text-decoration:none}
  .is,.cv-projeler li,.yetkinlik,.yan-liste li,.cv-ust,.cv-rakamlar{break-inside:avoid}
  .cv-baslik{break-after:avoid}
  /* İç grid'ler blok: Chromium grid parçalanmasında öğeler üst üste binebiliyor. */
  .cv-ana,.cv-yan,.yan-liste{display:block}
  .cv-ana>.cv-bolum+.cv-bolum{margin-top:18px}
  .cv-yan>.cv-bolum+.cv-bolum{margin-top:16px}
  .yetkinlik{margin-bottom:10px}
  .yan-liste li{margin-bottom:8px}
  .cv-alt{break-before:page;border-top:0}
  .cv-projeler{grid-template-columns:repeat(3,1fr)}
  /* A4 genişliği (~735px) dar ekran kurallarını tetikler; masaüstü yerleşimine geri al. */
  .cv-ust{grid-template-columns:1fr auto}
  .cv-foto{grid-row:auto}
  .cv-iletisim .iletisim{flex-direction:row;gap:4px 18px}
  .cv-iletisim .etiket{min-width:0}
  .cv-rakamlar{grid-template-columns:repeat(4,1fr)}
  .cv-rakam:nth-child(n+3){border-top:0}
  .cv-rakam:nth-child(3){border-left:1px solid var(--band-line)}

  /* Görsel baskı (varsayılan): ekrandaki iki sütunlu tasarım, A4'e ölçekli. */
  html:not(.ats-baski) body{font-size:12.5px}
  html:not(.ats-baski) .cv-govde{display:flex;align-items:stretch}
  html:not(.ats-baski) .cv-ana{flex:1.75 1 0;min-width:0;padding:20px 22px}
  html:not(.ats-baski) .cv-yan{flex:1 1 0;min-width:0;padding:20px 18px}
  html:not(.ats-baski) .cv-ust{padding:22px 22px 20px}
  html:not(.ats-baski) .cv-kimlik h1{font-size:36px}
  html:not(.ats-baski) .cv-foto{width:132px;height:132px}
  html:not(.ats-baski) .cv-rakam{padding:10px 22px}
  html:not(.ats-baski) .cv-rakam b{font-size:21px}
  html:not(.ats-baski) .cv-ana .cv-baslik{font-size:16px}
  html:not(.ats-baski) .is h3{font-size:15px}
  html:not(.ats-baski) .is{padding-bottom:14px}
  /* Uzun iş kayıtları sayfa arasında bölünebilir; başlık ilk maddeyle birlikte kalır. */
  html:not(.ats-baski) .is{break-inside:auto}
  html:not(.ats-baski) .is-bas{break-after:avoid;break-inside:avoid}
  html:not(.ats-baski) .maddeler li{break-inside:avoid}
  html:not(.ats-baski) .maddeler li{margin:2px 0}
  html:not(.ats-baski) .cv-yan .teknoloji{gap:4px}
  html:not(.ats-baski) .cv-yan .teknoloji li{font-size:11px;padding:1px 8px}
  html:not(.ats-baski) .cv-alt{padding:20px 22px}

  /* ATS baskısı (html.ats-baski): sistem yazı tipleri ve tek sütun; okuma sırası = DOM sırası. */
  html.ats-baski{--font-display:Arial,"Liberation Sans",Helvetica,sans-serif;--font-sans:Arial,"Liberation Sans",Helvetica,sans-serif;--font-mono:Arial,"Liberation Sans",Helvetica,sans-serif}
  html.ats-baski body{font-size:11.5px}
  html.ats-baski .cv-govde{display:block}
  html.ats-baski .cv-yan{border-left:0 !important;border-top:1px solid var(--line);padding:16px 20px}
  html.ats-baski .cv-ana{padding:16px 20px}
  html.ats-baski .cv-ust{padding:14px 20px}
  html.ats-baski .cv-foto{width:104px;height:104px}
  html.ats-baski .cv-rakamlar{grid-template-columns:repeat(4,auto);justify-content:space-between;padding:0 20px}
  html.ats-baski .cv-rakam{flex-direction:row;align-items:baseline;gap:6px;padding:7px 0;border:0}
  html.ats-baski .cv-rakam b{font-size:16px}
  html.ats-baski .cv-rakam span{font-size:11px}
  html.ats-baski .yan-liste li{display:block;margin-bottom:4px}
  html.ats-baski .yan-liste li>*{display:inline}
  html.ats-baski .yan-liste li>*+*{margin-left:10px}
  html.ats-baski .yetkinlik{margin-bottom:8px}
  html.ats-baski .cv-baslik{margin-bottom:8px}
  html.ats-baski .cv-yan .teknoloji{gap:4px}
  html.ats-baski .cv-yan .teknoloji li{font-size:10.5px;padding:1px 7px}
  html.ats-baski .maddeler li{margin:1px 0}
  html.ats-baski .is{padding-bottom:12px}
  html.ats-baski .cv-alt{padding:16px 20px}
}
</style>
</head>
<body data-sayfa="ozgecmis">
<header class="band">
  <div><p class="band-ad"><span class="band-nokta"></span><span id="band-ad">Kemal Beydilli</span></p><p class="band-alt" id="band-alt"></p></div>
  <div class="bant-tema" data-bant-tema>
    <div class="bt-seg bt-gor" id="dil-secici" role="group" aria-label="Dil"><button type="button" data-dil="tr" aria-pressed="false">TR</button><button type="button" data-dil="en" aria-pressed="false">EN</button></div>
  </div>
</header>

<footer class="alt-bant" id="alt-bant"></footer>
</body>
</html>
