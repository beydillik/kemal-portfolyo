<!doctype html>
<!-- Bant düzeni: tanitim. Palet indigo (AGENTS.md). İçerik data/*.json'dan js/site.js ile gelir; buraya içerik yazılmaz. -->
<html lang="tr" data-palet="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kemal Beydilli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="bant-tema.css">
<link rel="stylesheet" href="bant-temel.css">
<script src="bant-tema.js"></script>
<script>/* Varsayılan açık görünüm: kullanıcı Açık/Koyu seçmediyse sistemin koyu ayarı uygulanmaz (bant-tema.js değiştirilmeden). */
(function(){function acik(){try{if(localStorage.getItem("bant-gorunum"))return}catch(e){}if(window.Bant&&Bant.tema)Bant.tema.uygula(null,"acik")}acik();document.addEventListener("DOMContentLoaded",acik)})();</script>
<script src="js/site.js" defer></script>
<style>
/* Ortak: genişlik, tarih, teknoloji etiketi. Renk yalnızca var(--…) ile. */
.govde{max-width:1120px;margin:0 auto}
.tarih{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.teknoloji{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.teknoloji li{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--box);color:var(--ink-2)}
.bolum-baslik{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px}
.metin{margin:var(--space-2) 0 0;max-width:72ch}
.not{margin:0;font-size:13.5px;color:var(--ink-2)}
#ozgecmis{display:grid;gap:var(--space-5)}
.unvan{margin:0;color:var(--ink-2);font-size:16px}
.is-bas{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.is h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:17px}
.sirket{margin:2px 0 0;color:var(--ink-2);font-weight:500}
.maddeler{margin:var(--space-2) 0 0;padding-left:20px}
.maddeler li{margin:4px 0}
.is .not{margin-top:var(--space-2)}
.iki-sutun{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--space-5);align-items:start}
.iletisim{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5)}
.iletisim li{display:flex;gap:var(--space-2);align-items:baseline;overflow-wrap:anywhere;min-width:0}
.iletisim .etiket{margin:0}
.zaman{list-style:none;margin:var(--space-2) 0 0;padding:0}
.zaman li{display:flex;justify-content:space-between;gap:var(--space-3);padding:4px 0}
@media (max-width:640px){.iki-sutun{grid-template-columns:1fr}}
@media print{
  .band,.bar,.alt-bant,.eylem,.pdf-not{display:none}
  body{background:var(--card)}
  .govde{padding:0;max-width:none}
  .kart{box-shadow:none;border:0;break-inside:auto}
  .is{break-inside:avoid}
  .iki-sutun{grid-template-columns:1fr 1fr}
  a{color:var(--ink);text-decoration:none}
}
</style>
</head>
<body data-sayfa="ozgecmis">
<header class="band">
  <div><p class="band-ad"><span class="band-nokta"></span><span id="band-ad">Kemal Beydilli</span></p><p class="band-alt" id="band-alt"></p></div>
  <div class="bant-tema" data-bant-tema>
    <div class="bt-seg bt-gor" id="dil-secici" role="group" aria-label="Dil"><button type="button" data-dil="tr" aria-pressed="false">TR</button><button type="button" data-dil="en" aria-pressed="false">EN</button></div>
  </div>
</header>
<nav class="bar" aria-label="Bölümler"><a href="index.html" data-i18n="nav_ana"></a><a href="projeler.html" data-i18n="nav_projeler"></a><a href="ozgecmis.html" aria-current="page" data-i18n="nav_ozgecmis"></a></nav>
<main class="govde">
<noscript><div class="kart kart-bolum"><p>JavaScript is required to show this site. / Bu siteyi göstermek için JavaScript gerekir.</p></div></noscript>
<div id="ozgecmis"></div>
</main>
<footer class="alt-bant" id="alt-bant"></footer>
</body>
</html>
